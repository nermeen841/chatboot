name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos  
      - name: Test
        run: flutter test

      - name: Build staging APK
        run: flutter build apk --debug --flavor staging

      - name: Build production APK
        run: flutter build apk --debug --flavor production

  ios:
    name: Build iOS simulator flavors
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - staging
          - production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.flavor }} iOS simulator app
        run: flutter build ios --debug --simulator --flavor ${{ matrix.flavor }}

  ios-release:
    name: Sign iOS IPAs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify signing credentials
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_STAGING_PROFILE_BASE64: ${{ secrets.IOS_STAGING_PROFILE_BASE64 }}
          IOS_PRODUCTION_PROFILE_BASE64: ${{ secrets.IOS_PRODUCTION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in IOS_TEAM_ID IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_STAGING_PROFILE_BASE64 IOS_PRODUCTION_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the GitHub variable or secret $name before starting an iOS release."
              exit 1
            fi
          done

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profiles
        id: profiles
        env:
          IOS_STAGING_PROFILE_BASE64: ${{ secrets.IOS_STAGING_PROFILE_BASE64 }}
          IOS_PRODUCTION_PROFILE_BASE64: ${{ secrets.IOS_PRODUCTION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"

          install_profile() {
            local flavor="$1"
            local profile_data="$2"
            local profile_path="$RUNNER_TEMP/$flavor.mobileprovision"
            local profile_plist="$RUNNER_TEMP/$flavor-profile.plist"

            printf '%s' "$profile_data" | base64 --decode > "$profile_path"
            security cms -D -i "$profile_path" > "$profile_plist"

            local profile_uuid
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
            local profile_name
            profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
            cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"

            echo "${flavor}_profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
            echo "${flavor}_profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          }

          install_profile staging "$IOS_STAGING_PROFILE_BASE64"
          install_profile production "$IOS_PRODUCTION_PROFILE_BASE64"

      - name: Configure manual code signing
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          STAGING_PROFILE_NAME: ${{ steps.profiles.outputs.staging_profile_name }}
          PRODUCTION_PROFILE_NAME: ${{ steps.profiles.outputs.production_profile_name }}
          IOS_EXPORT_OPTIONS_PATH: ${{ runner.temp }}/ios-export-options.plist
        run: |
          set -euo pipefail
          cat > ios/Flutter/Signing-staging.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = $IOS_TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER = $STAGING_PROFILE_NAME
          EOF
          cat > ios/Flutter/Signing-production.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = $IOS_TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER = $PRODUCTION_PROFILE_NAME
          EOF
          python3 - "$IOS_EXPORT_OPTIONS_PATH" <<'PY'
          import os
          import plistlib
          import sys

          options = {
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": os.environ["IOS_TEAM_ID"],
              "provisioningProfiles": {
                  "com.example.chatboot.staging": os.environ["STAGING_PROFILE_NAME"],
                  "com.example.chatboot.production": os.environ["PRODUCTION_PROFILE_NAME"],
              },
          }
          with open(sys.argv[1], "wb") as export_options:
              plistlib.dump(options, export_options)
          PY

      - name: Build staging IPA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IOS_EXPORT_OPTIONS_PATH: ${{ runner.temp }}/ios-export-options.plist
        run: |
          flutter build ipa --release --flavor staging \
            --export-options-plist="$IOS_EXPORT_OPTIONS_PATH" \
            --dart-define="GEMINI_API_KEY=$GEMINI_API_KEY"
          mkdir -p release-artifacts
          ipa_path=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$ipa_path"
          cp "$ipa_path" release-artifacts/chatboot-staging.ipa

      - name: Build production IPA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IOS_EXPORT_OPTIONS_PATH: ${{ runner.temp }}/ios-export-options.plist
        run: |
          flutter build ipa --release --flavor production \
            --export-options-plist="$IOS_EXPORT_OPTIONS_PATH" \
            --dart-define="GEMINI_API_KEY=$GEMINI_API_KEY"
          ipa_path=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$ipa_path"
          cp "$ipa_path" release-artifacts/chatboot-production.ipa

      - name: Upload signed IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipas-${{ github.run_number }}
          path: release-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
